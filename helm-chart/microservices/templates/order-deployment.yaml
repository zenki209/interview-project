apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: order-service
    version: v1
spec:
  replicas: {{ .Values.orderService.replicas }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      containers:
      - name: order-service
        image: "{{ .Values.orderService.image.name }}:{{ .Values.orderService.image.tag }}"
        imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.orderService.port }}
        env:
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.orderService.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.orderService.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
