apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service-v2
  namespace: {{ .Release.Namespace }}
  labels:
    app: review-service
    version: v2
spec:
  replicas: {{ .Values.reviewService.v2.replicas }}
  selector:
    matchLabels:
      app: review-service
      version: v2
  template:
    metadata:
      labels:
        app: review-service
        version: v2
    spec:
      containers:
      - name: review-service
        image: "{{ .Values.reviewService.v2.image.name }}:{{ .Values.reviewService.v2.image.tag }}"
        imagePullPolicy: {{ .Values.reviewService.v2.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.reviewService.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.reviewService.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.reviewService.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
