apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
  - {{ .Values.istio.gateway.host | quote }}
  gateways:
  - {{ .Release.Name }}-gateway
  http:
  - match:
    - uri:
        prefix: {{ .Values.istio.virtualservice.pathPrefix }}
    rewrite:
      uri: /                 # strip the prefix before forwarding to the app
    timeout: {{ .Values.istio.virtualservice.timeout }}
    retries:
      attempts: {{ .Values.istio.virtualservice.retries.attempts }}
      perTryTimeout: {{ .Values.istio.virtualservice.retries.perTryTimeout }}
      retryOn: "5xx,reset,connect-failure,retriable-4xx"
    route:
    - destination:
        host: {{ .Release.Name }}
        port:
          number: {{ .Values.service.port }}
      weight: 100
